name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (matches netlify.toml NODE_VERSION=20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Regenerate the admin dashboard's app catalogue from src/data/apps.ts and
      # surface drift as its own failure. The prebuild hook in package.json also
      # runs this, but running it explicitly here means the error message points
      # at the catalogue step rather than a cryptic "build failed" at the end.
      - name: Regenerate admin dashboard app catalogue
        run: npm run generate:admin-catalogue

      - name: Check for app-catalogue drift
        run: |
          if ! git diff --quiet -- admin-server/public/app-catalogue.js; then
            echo "::error file=admin-server/public/app-catalogue.js::admin-server/public/app-catalogue.js is out of sync with src/data/apps.ts."
            echo "Run 'npm run generate:admin-catalogue' locally and commit the result."
            git --no-pager diff -- admin-server/public/app-catalogue.js
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
