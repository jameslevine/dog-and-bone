<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFB703"/>

  <!-- Dog face base -->
  <ellipse cx="50" cy="55" rx="28" ry="32" fill="white"/>

  <!-- Left ear -->
  <ellipse cx="28" cy="25" rx="12" ry="18" fill="#2C1503"/>

  <!-- Right ear (orange patch) -->
  <ellipse cx="72" cy="25" rx="12" ry="18" fill="#FF8C42"/>

  <!-- Left eye -->
  <ellipse cx="38" cy="48" rx="4" ry="6" fill="#2C1503"/>

  <!-- Right eye -->
  <ellipse cx="62" cy="48" rx="4" ry="6" fill="#2C1503"/>

  <!-- Nose -->
  <ellipse cx="50" cy="62" rx="6" ry="5" fill="#2C1503"/>

  <!-- Mouth -->
  <path d="M50 62 Q40 70 35 68 M50 62 Q60 70 65 68" stroke="#2C1503" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Tongue (small) -->
  <ellipse cx="50" cy="72" rx="3" ry="4" fill="#E63946"/>

  <!-- Bone at bottom -->
  <g transform="translate(50, 88)">
    <!-- Bone circles -->
    <circle cx="-12" cy="0" r="4" fill="#2C1503"/>
    <circle cx="12" cy="0" r="4" fill="#2C1503"/>
    <!-- Bone bar -->
    <rect x="-10" y="-2" width="20" height="4" rx="2" fill="#2C1503"/>
  </g>
</svg>
