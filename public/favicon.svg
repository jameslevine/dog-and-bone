<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFB703"/>

  <!-- Dog head (rounded rectangle, more vertical) -->
  <rect x="30" y="35" width="40" height="45" rx="20" fill="white"/>

  <!-- Left ear (brown, floppy) -->
  <ellipse cx="32" cy="30" rx="10" ry="22" fill="#2C1503" transform="rotate(-15 32 30)"/>

  <!-- Right ear (orange patch, floppy) -->
  <ellipse cx="68" cy="30" rx="10" ry="22" fill="#FF8C42" transform="rotate(15 68 30)"/>

  <!-- Snout area (lighter oval) -->
  <ellipse cx="50" cy="60" rx="16" ry="14" fill="#F5F5F5"/>

  <!-- Left eye -->
  <circle cx="40" cy="48" r="3.5" fill="#2C1503"/>

  <!-- Right eye -->
  <circle cx="60" cy="48" r="3.5" fill="#2C1503"/>

  <!-- Nose (bigger, more prominent) -->
  <ellipse cx="50" cy="63" rx="5" ry="4" fill="#2C1503"/>

  <!-- Mouth line from nose -->
  <line x1="50" y1="67" x2="50" y2="72" stroke="#2C1503" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M44 72 Q50 76 56 72" stroke="#2C1503" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Tongue (peeking out) -->
  <ellipse cx="50" cy="75" rx="4" ry="3" fill="#E63946"/>

  <!-- Small bone at bottom -->
  <g transform="translate(50, 90)">
    <circle cx="-8" cy="0" r="3" fill="#2C1503"/>
    <circle cx="8" cy="0" r="3" fill="#2C1503"/>
    <rect x="-7" y="-1.5" width="14" height="3" rx="1.5" fill="#2C1503"/>
  </g>
</svg>
