plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load the device-tracking API URL + key from local.properties (gitignored) or env vars.
// Falls back to empty strings so `./gradlew build` doesn't fail in CI; the launcher will
// log an error and skip registration if the values are blank at runtime.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def awsDeviceApiUrl = localProps.getProperty('AWS_DEVICE_API_URL') ?: System.getenv('AWS_DEVICE_API_URL') ?: ''
def awsDeviceApiKey = localProps.getProperty('AWS_DEVICE_API_KEY') ?: System.getenv('AWS_DEVICE_API_KEY') ?: ''

android {
    namespace 'com.dogandbonephone.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.dogandbonephone.launcher"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "AWS_DEVICE_API_URL", "\"${awsDeviceApiUrl}\""
        buildConfigField "String", "AWS_DEVICE_API_KEY", "\"${awsDeviceApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // WorkManager for periodic config sync
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
